# Principle 03: pods that don't call the Kubernetes API must not carry an API token.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: no-service-account-token
  annotations:
    policies.kyverno.io/title: Disable service-account token automount
    secops-lab/fixes: F-001
spec:
  background: true
  rules:
    - name: automount-disabled
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [juice-shop]
      validate:
        failureAction: Audit
        message: "Set automountServiceAccountToken: false (the app never calls the Kubernetes API)."
        pattern:
          spec:
            automountServiceAccountToken: false
