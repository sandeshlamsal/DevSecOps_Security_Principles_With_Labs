# F-003: default-deny for the juice-shop namespace, then allow only what the app needs.
# Blocks east-west traffic so a compromise of another workload can't reach the app, and vice versa.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: juice-shop
spec:
  podSelector: {}                 # all pods in the namespace
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app
  namespace: juice-shop
spec:
  podSelector:
    matchLabels: {app: juice-shop}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}               # only pods IN the juice-shop namespace (e.g. a future reverse proxy)
      ports:
        - {port: 3000, protocol: TCP}   # kubelet readiness probes and `kubectl port-forward` are node-sourced and remain exempt
  egress:
    - to:                               # DNS resolution only
        - namespaceSelector: {}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {port: 53, protocol: UDP}
        - {port: 53, protocol: TCP}
