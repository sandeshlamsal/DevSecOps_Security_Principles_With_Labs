# Reverse proxy in front of Juice Shop. Virtual patch (plan B1) for the exposed-path findings.
# Runs unprivileged on 8080. Blocks internal/sensitive paths before they reach the app.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  error_log  /dev/stderr;
  server_tokens off;                       # don't leak nginx version
  client_max_body_size 5m;
  client_body_timeout 10s;
  client_header_timeout 10s;

  server {
    listen 8080;
    # F-005, F-006, F-013, F-014, F-015: refuse internal/sensitive paths at the edge.
    location ~ ^/(ftp|infrastructure|encryptionkeys|support/logs|metrics)(/|$) { return 404; }

    location / {
      proxy_pass http://juice-shop.juice-shop.svc:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
